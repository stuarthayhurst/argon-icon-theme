# This workflow will test the build system (validate symlinks, index generator and installing / uninstalling)
name: Complete build system test

on:
  push:
    branches: '**'
  pull_request:
    branches: '**'
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-slim
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: Install build dependencies
      run: |
        sudo apt-get install --no-install-recommends make

    - name: Check all symlinks are valid
      run: |
        make check

    - name: Test index generator
      run: |
        PREFIX_DIR=./ make index

    - name: Test install and uninstall targets
      run: |
        sudo make install
        sudo make uninstall
